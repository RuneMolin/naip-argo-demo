# Schema registry, deployed alongside Kafka. Uses Apicurio's in-memory storage
# variant for simplicity (zero extra config, works out of the box) — data is
# lost on pod restart. Swap the image + add env vars for a persistent backend
# (PostgreSQL, or Kafka-based "kafkasql" storage) before using in production;
# check the exact env var names against the Apicurio major version you use,
# they changed between the 2.x and 3.x releases.
{{- if .Values.kafka.apicurio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.kafka.clusterName }}-apicurio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Values.kafka.clusterName }}
    app.kubernetes.io/name: apicurio-registry
spec:
  replicas: {{ .Values.kafka.apicurio.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.kafka.clusterName }}
      app.kubernetes.io/name: apicurio-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Values.kafka.clusterName }}
        app.kubernetes.io/name: apicurio-registry
    spec:
      containers:
        - name: apicurio-registry
          image: {{ .Values.kafka.apicurio.image }}
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.clusterName }}-apicurio
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Values.kafka.clusterName }}
    app.kubernetes.io/name: apicurio-registry
spec:
  selector:
    app.kubernetes.io/instance: {{ .Values.kafka.clusterName }}
    app.kubernetes.io/name: apicurio-registry
  ports:
    - port: 8080
      targetPort: 8080
{{- if .Values.kafka.apicurio.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.kafka.clusterName }}-apicurio
  namespace: {{ .Release.Namespace }}
spec:
  rules:
    - host: {{ .Values.kafka.apicurio.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.kafka.clusterName }}-apicurio
                port:
                  number: 8080
{{- end }}
{{- end }}
